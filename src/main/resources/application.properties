# 1. Configuración general
spring.application.name=portal-indie
server.port=8080

# 2. Base de datos (PostgreSQL en Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/portal_db
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 4. CORS y Dialecto
security.cors.allowed-origins=http://localhost:4200
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. Integración externa (RAWG API)
rawg.api.key=${RAWG_API_KEY:}
rawg.api.base-url=https://api.rawg.io/api

# 6. Seguridad JWT
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=86400000